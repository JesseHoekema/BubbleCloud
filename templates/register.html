<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleCloud - Register</title>
    <link rel="shortcut icon" href="/static/logo_favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap');
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-icon {
            font-size: 24px;
            color: #1976d2;
            margin-right: 8px;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 600;
            color: #333333;
        }
        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #555555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333333;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1976d2;
        }
        .input-wrapper .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999999;
        }
        .radio-group {
            text-align: left;
            font-size: 14px;
            color: #555555;
        }
        .radio-group label {
            display: block;
            margin-bottom: 6px;
        }
        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #1976d2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .register-btn:hover {
            background-color: #1565c0;
        }
        .error-message {
            color: red;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">
        <div class="logo-text">
                        <img src="{{ url_for('static', filename='logo_text_big.png') }}" alt="BubbleCloud Logo" style="height: 40px; vertical-align: middle;">
        </div>
    </div>

    <h2>Create your account</h2>

    <form method="post">
        <div class="input-group">
            <label for="name">Full Name</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-id-card icon"></i>
                <input type="text" id="name" name="name" placeholder="Full Name" required>
            </div>
        </div>

        <div class="input-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
        </div>

        <div class="radio-group">
            <label>Store password as:</label>
            <label><input type="radio" name="encryption" value="plain" checked> Plain text</label>
            <label><input type="radio" name="encryption" value="hashed"> Encrypted (hashed)</label>
        </div>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <button type="submit" class="register-btn">Register</button>
    </form>
</div>

</body>
</html>
